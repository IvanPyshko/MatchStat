<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MatchStat — карточка игрока</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --gold1:#f6e7a1; --gold2:#d9b44a; --gold3:#a97c1f; --ink:#3a2a08; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; padding:20px 14px 90px; display:flex; flex-direction:column; align-items:center; gap:22px;
    background: radial-gradient(circle at 50% 20%, #1f3a5f, #0b1320 75%) fixed;
    font-family:'Oswald','Arial Narrow',Impact,sans-serif; color:#fff;
  }
  .league-title {
    margin:0; text-align:center; font-size:clamp(20px, 5.5vw, 34px); font-weight:700;
    letter-spacing:3px; text-transform:uppercase; line-height:1.1;
    color:var(--gold1);
    text-shadow:0 2px 0 var(--gold3), 0 6px 18px rgba(0,0,0,.55);
  }
  .controls {
    display:flex; flex-wrap:wrap; justify-content:center; align-items:center;
    gap:10px; width:100%;
  }
  select { font:inherit; padding:9px 12px; border-radius:10px; border:0; background:#e9eef6; width:min(100%,260px); }
  .wrap { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:28px; width:100%; }

  /* ===== Карточка ===== */
  .card {
    position:relative; font-size:clamp(14px, 4.8vw, 21px); color:var(--ink);
    width:20em; height:29.4em; padding:1.6em 1.5em; flex:none;
    background:linear-gradient(155deg,var(--gold1) 0%,var(--gold2) 45%,var(--gold3) 100%);
    clip-path:polygon(50% 0,88% 5%,100% 9%,100% 88%,50% 100%,0 88%,0 9%,12% 5%);
    filter:drop-shadow(0 12px 24px rgba(0,0,0,.5));
  }
  .card::before { content:""; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(115deg,rgba(255,255,255,.18) 0 2px,transparent 2px 26px); }
  .top { display:flex; height:12.5em; position:relative; }
  .left { width:5.25em; padding-top:2.1em; text-align:center; }
  .rating { font-size:3.4em; font-weight:700; line-height:1; }
  .rl { font-size:.75em; letter-spacing:2px; font-weight:600; }
  .prod { margin-top:.9em; font-size:.7em; letter-spacing:1px; border-top:2px solid rgba(58,42,8,.45); padding-top:.7em; }
  .prod b { display:block; font-size:1.8em; }
  .photo { position:absolute; right:-.25em; bottom:0; width:11.9em; height:11.9em; display:flex; align-items:flex-end; justify-content:center; }
  .photo img { max-width:100%; max-height:100%; object-fit:contain; object-position:bottom; }
  .ph { font-size:5.6em; opacity:.35; }
  .namebox { height:2.4em; margin-top:.4em; display:flex; align-items:center; justify-content:center; overflow:hidden;
    border-bottom:2px solid rgba(58,42,8,.45); }
  .nm { display:inline-block; white-space:nowrap; font-size:1.7em; font-weight:700; text-transform:uppercase; letter-spacing:1px; line-height:1.1; }
  .season {
    margin-top:.55em; text-align:center; font-size:.8em; font-weight:600;
    letter-spacing:2px; text-transform:uppercase; color:var(--ink); opacity:.8;
  }
  .stats { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(3,auto); grid-auto-flow:column; gap:.4em .6em; padding:.9em .4em 0; }
  .stat { display:flex; align-items:baseline; gap:.4em; font-size:1.4em; font-weight:700; white-space:nowrap; }
  .stat span { font-size:.6em; font-weight:400; letter-spacing:.5px; }
  .stat:nth-child(-n+3) { border-right:2px solid rgba(58,42,8,.35); }

  /* ===== Боковая панель ===== */
  .side { width:min(100%,440px); display:grid; gap:12px; }
  .panel { background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); border-radius:16px; padding:16px 18px; backdrop-filter:blur(6px); }
  .ptitle { font-size:13px; letter-spacing:2px; color:#9fb4d3; text-transform:uppercase; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .tile + .tile { margin-top:14px; }
  .trow { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .tl { font-size:16px; letter-spacing:.5px; color:#dbe6f6; display:flex; align-items:center; gap:6px; }
  .tv { font-size:28px; font-weight:700; color:var(--gold1); }
  .tv small { font-size:14px; font-weight:400; color:#9fb4d3; margin-left:4px; }
  .bar { height:8px; border-radius:6px; background:rgba(255,255,255,.12); margin-top:6px; overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,var(--gold3),var(--gold1)); }
  .totals { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; text-align:center; }
  .totals div { background:rgba(255,255,255,.06); border-radius:12px; padding:10px 4px; }
  .totals b { display:block; font-size:26px; color:var(--gold1); }
  .totals span { font-size:12px; letter-spacing:1px; color:#9fb4d3; display:inline-flex; align-items:center; justify-content:center; gap:4px; }

  /* ===== Кружок с вопросом и подсказка ===== */
  .hint { position:relative; display:inline-flex; align-items:center; justify-content:center; flex:none; }
  .hint > button {
    all:unset; box-sizing:border-box; width:16px; height:16px; border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center;
    font:700 11px/1 'Oswald',sans-serif; color:#0b1320;
    background:rgba(159,180,211,.55);
    cursor:pointer; user-select:none;
    transition:background .15s, color .15s;
  }
  .hint > button:hover, .hint > button:focus-visible { background:var(--gold1); color:var(--ink); outline:none; }
  .hint .tip {
    position:absolute; left:50%; bottom:calc(100% + 8px); transform:translateX(-50%) translateY(4px);
    min-width:180px; max-width:260px; padding:8px 10px; border-radius:10px;
    background:#0e1a2b; color:#e8eef8; font-size:12.5px; font-weight:400; line-height:1.35; letter-spacing:.2px;
    box-shadow:0 8px 22px rgba(0,0,0,.5); border:1px solid rgba(246,231,161,.25);
    opacity:0; pointer-events:none; transition:opacity .15s, transform .15s;
    z-index:20; white-space:normal; text-align:left;
  }
  .hint .tip::after {
    content:""; position:absolute; top:100%; left:50%; transform:translateX(-50%);
    border:6px solid transparent; border-top-color:#0e1a2b;
  }
  .hint.open .tip, .hint:hover .tip { opacity:1; transform:translateX(-50%) translateY(0); }
  /* на мобильных hover не нужен — открываем только по клику */
  @media (hover:none) { .hint:hover .tip { opacity:0; transform:translateX(-50%) translateY(4px); } .hint.open .tip { opacity:1; transform:translateX(-50%) translateY(0); } }

  /* ===== Музыка ===== */
  #music, #trackLink { position:fixed; right:calc(16px + env(safe-area-inset-right,0px)); bottom:calc(16px + env(safe-area-inset-bottom,0px));
    height:54px; min-width:54px; border-radius:27px; border:0; background:linear-gradient(135deg,var(--gold1),var(--gold3)); color:var(--ink);
    font:700 20px 'Oswald',sans-serif; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; padding:0 18px; text-decoration:none; }
  #music[hidden], #trackLink[hidden] { display:none; }
  #music.on { animation:pulse 1.6s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 10px rgba(246,231,161,.18), 0 6px 18px rgba(0,0,0,.45); } }
  .err { color:#ffb4b4; max-width:420px; text-align:center; font-family:Arial,sans-serif; }
</style>
</head>
<body>
  <h1 class="league-title">Лига Пивных Животов</h1>
  <div class="controls">
    <select id="picker" aria-label="Игрок"></select>
    <select id="seasonPicker" aria-label="Сезон"></select>
  </div>
  <div class="wrap" id="root"></div>
  <button id="music" hidden aria-label="Музыка">♪</button>
  <a id="trackLink" hidden target="_blank" rel="noopener">♪ Трек</a>

<script>
// ====== НАСТРОЙКИ ======
const SUPABASE_URL = "https://jndrxhmlgamzlqcfpqun.supabase.co";
const SUPABASE_KEY = "sb_publishable_lT94AQ-q-57M620LTo3NYQ_2zXO53GO";
const PHOTO_BUCKET = "player-photos";
const MUSIC_BUCKET = "player-music";

const SEASON_PARAM = "p_year"; // ← имя параметра сезона в RPC

const H = { apikey: SUPABASE_KEY, "Content-Type": "application/json" };
const REST = SUPABASE_URL + "/rest/v1/";
const pub = (bucket, p) => `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${encodeURIComponent(p)}`;
const isUrl = v => /^https?:\/\//i.test(v);
const fmt = (v, d = 0) => v == null ? "—" : Number(v).toLocaleString("ru", { maximumFractionDigits: d });

async function api(path, opts) {
  const r = await fetch(REST + path, { headers: H, ...opts });
  if (!r.ok) throw new Error(`Ошибка запроса (${r.status})`);
  return r.json();
}
const getPlayers = () => api("players?select=id,name&order=name");

async function getSeasons() {
  const rows = await api("tours?select=tour_year&order=tour_year.desc");
  const set = new Set();
  for (const r of rows) if (r.tour_year != null && r.tour_year !== "") set.add(String(r.tour_year));
  return [...set];
}

async function getStats(id, year) {
  const body = { p_player_id: id };
  if (year != null && year !== "") body[SEASON_PARAM] = year;
  const rows = await api("rpc/get_player_overall_stats", { method: "POST", body: JSON.stringify(body) });
  return rows[0];
}

const getMusicLink = async id => (await api(`players?select=music_track_link&id=eq.${id}`))[0]?.music_track_link || null;

let MAX = {};
async function loadMax() {
  try {
    const rows = await api("player_overall_stats?select=avg_points_per_tour,avg_goals_per_tour,avg_assists_per_tour,avg_goal_assists_per_tour");
    for (const k of ["avg_points_per_tour","avg_goals_per_tour","avg_assists_per_tour","avg_goal_assists_per_tour"])
      MAX[k] = Math.max(0, ...rows.map(r => Number(r[k]) || 0));
  } catch (e) { /* оставляем прежние значения */ }
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

// ====== ТЕКСТЫ ПОДСКАЗОК ======
const TIPS = {
  points:      "1 место — 3 очка, 2 место — 2 очка, 3 место — 0 очков.",
  goalAssists: "Г+П — голы + передачи.",
  avg:         "Ср. — среднее за тур.",
  value:       "Ценность — показатель продуктивности (0.6 × ср. очки за тур + 0.4 × ср. Г+П за тур).",
  attendance:  "Посещение — доля сыгранных туров.",
  rating:      "Рейтинг — ценность с учётом посещения."
};

// Кружок «?» с подсказкой. Возвращает элемент .hint
function hint(key) {
  const wrap = el("span", "hint");
  const b = el("button"); b.type = "button"; b.textContent = "?"; b.setAttribute("aria-label", "Подсказка");
  const tip = el("span", "tip", TIPS[key] || "");
  wrap.append(b, tip);
  b.addEventListener("click", e => {
    e.stopPropagation();
    const wasOpen = wrap.classList.contains("open");
    document.querySelectorAll(".hint.open").forEach(x => x.classList.remove("open"));
    if (!wasOpen) wrap.classList.add("open");
  });
  return wrap;
}

function fitName(box, nm) {
  let f = 1.7; nm.style.fontSize = f + "em";
  while (nm.offsetWidth > box.clientWidth && f > 0.8) { f -= 0.05; nm.style.fontSize = f + "em"; }
}

// label с опциональным кружком
function labelWithHint(text, key) {
  const d = el("div", "tl"); d.append(el("span", null, text));
  if (key) d.append(hint(key));
  return d;
}

function tile(label, value, max, suffix, key) {
  const t = el("div", "tile"), row = el("div", "trow");
  const tv = el("div", "tv", fmt(value, 2)); if (suffix) tv.append(el("small", null, suffix));
  row.append(labelWithHint(label, key), tv);
  const bar = el("div", "bar"), i = el("i");
  i.style.width = (max > 0 ? Math.min(100, (Number(value) || 0) / max * 100) : 0) + "%";
  bar.append(i); t.append(row, bar); return t;
}

function totalCell(labelText, value, key) {
  const d = el("div"); d.append(el("b", null, typeof value === "string" ? value : fmt(value)));
  const s = el("span"); s.append(el("span", null, labelText));
  if (key) s.append(hint(key));
  d.append(s); return d;
}

function render(s, yearForLabel) {
  const root = document.getElementById("root");
  root.replaceChildren();
  if (!s) { root.append(el("p", "err", "Нет данных по этому игроку за выбранный сезон")); return; }

  // --- карточка ---
  const card = el("div", "card"), top = el("div", "top"), left = el("div", "left");
  left.append(el("div", "rating", fmt(s.rating, 1)), el("div", "rl", "РЕЙТИНГ"));
  const prod = el("div", "prod", "ЦЕННОСТЬ"); prod.append(el("b", null, fmt(s.productivity_value, 2))); left.append(prod);

  const photo = el("div", "photo");
  if (s.photo_url) {
    const img = new Image(); img.alt = s.player_name;
    img.onerror = () => photo.replaceChildren(el("div", "ph", "👤"));
    img.src = isUrl(s.photo_url) ? s.photo_url : pub(PHOTO_BUCKET, s.photo_url);
    photo.append(img);
  } else photo.append(el("div", "ph", "👤"));
  top.append(left, photo);

  const box = el("div", "namebox"), nm = el("span", "nm", s.player_name); box.append(nm);

  const season = (s.year != null && s.year !== "") ? String(s.year) : (yearForLabel ? String(yearForLabel) : null);
  if (season) card.append(top, box, el("div", "season", "Сезон " + season));
  else card.append(top, box);

  const stats = el("div", "stats");
  [["ГОЛЫ", s.goals], ["ПАСЫ", s.assists], ["Г+П", s.goal_assists],
   ["ТУРЫ", s.played_tours], ["ОЧКИ", s.points], ["ПОСЕЩЕНИЕ", s.attendance_pct == null ? null : fmt(s.attendance_pct, 0) + "%"]]
    .forEach(([label, v]) => { const r = el("div", "stat", typeof v === "string" ? v : fmt(v)); r.append(el("span", null, label)); stats.append(r); });
  card.append(stats);

  // --- боковая панель ---
  const side = el("div", "side");

  const avg = el("div", "panel");
  const avgTitle = el("div", "ptitle"); avgTitle.append(el("span", null, "В среднем за тур"), hint("avg"));
  avg.append(avgTitle,
    tile("Очки", s.avg_points_per_tour, MAX.avg_points_per_tour, null, "points"),
    tile("Голы", s.avg_goals_per_tour, MAX.avg_goals_per_tour),
    tile("Пасы", s.avg_assists_per_tour, MAX.avg_assists_per_tour),
    tile("Г+П",  s.avg_goal_assists_per_tour, MAX.avg_goal_assists_per_tour, null, "goalAssists"));

  const att = el("div", "panel"); att.append(el("div", "ptitle", "Оценка"));
  att.append(
    tile("Ценность", s.productivity_value, Math.max(3, Number(s.productivity_value) || 0), null, "value"),
    tile("Рейтинг",  s.rating, 10, null, "rating"));

  const tot = el("div", "panel"); tot.append(el("div", "ptitle", "Всего"));
  const g = el("div", "totals");
  g.append(
    totalCell("ГОЛЫ", s.goals),
    totalCell("ПАСЫ", s.assists),
    totalCell("Г+П",  s.goal_assists, "goalAssists"),
    totalCell("ТУРЫ", s.played_tours),
    totalCell("ОЧКИ", s.points, "points"),
    totalCell("ПОСЕЩЕНИЕ", s.attendance_pct == null ? null : fmt(s.attendance_pct, 0) + "%", "attendance"));
  tot.append(g);

  side.append(avg, att, tot);

  root.append(card, side);
  fitName(box, nm);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitName(box, nm));
}

// закрываем подсказки по клику вне
document.addEventListener("click", () => document.querySelectorAll(".hint.open").forEach(x => x.classList.remove("open")));
document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll(".hint.open").forEach(x => x.classList.remove("open")); });

// ====== МУЗЫКА ======
const audio = new Audio(); audio.loop = true;
const btn = document.getElementById("music"), link = document.getElementById("trackLink");
let hasTrack = false, userPaused = false;
const sync = () => { btn.textContent = audio.paused ? "♪" : "❚❚"; btn.classList.toggle("on", !audio.paused); };
audio.onplay = audio.onpause = sync;
audio.onerror = () => { hasTrack = false; btn.hidden = true; };
function tryPlay() { if (hasTrack && !userPaused) audio.play().catch(() => {}); }
btn.onclick = () => { if (audio.paused) { userPaused = false; audio.play().catch(() => {}); } else { userPaused = true; audio.pause(); } };
["pointerdown", "keydown"].forEach(ev => addEventListener(ev, e => {
  if (e.target.closest && e.target.closest("#music")) return;
  if (audio.paused) tryPlay();
}));

function setMusic(v) {
  audio.pause(); hasTrack = false; btn.hidden = true; link.hidden = true;
  if (!v) return;
  if (isUrl(v) && !/\.(mp3|m4a|aac|ogg|wav|webm)(\?|$)/i.test(v) && !v.includes("/storage/v1/object/")) {
    link.href = v; link.hidden = false; return;
  }
  audio.src = isUrl(v) ? v : pub(MUSIC_BUCKET, v);
  hasTrack = true; btn.hidden = false; sync(); tryPlay();
}

// ====== УПРАВЛЕНИЕ ======
const picker = document.getElementById("picker");
const seasonPicker = document.getElementById("seasonPicker");
const REFRESH_MS = 10000;
let lastSig = "", curMusic;

function currentSelection() { return { id: picker.value, year: seasonPicker.value }; }

async function show() {
  const { id, year } = currentSelection();
  if (!id) return;
  try {
    const s = await getStats(id, year);
    lastSig = JSON.stringify([s, MAX, year]); render(s, year);
    getMusicLink(id).then(m => { if (id === picker.value) { curMusic = m; setMusic(m); } })
                    .catch(() => { curMusic = null; setMusic(null); });
  } catch (e) { document.getElementById("root").replaceChildren(el("p", "err", e.message)); }
}

let busy = false;
async function refresh() {
  if (busy || document.hidden || !picker.value) return;
  busy = true;
  const { id, year } = currentSelection();
  try {
    const [s] = await Promise.all([getStats(id, year), loadMax()]);
    const sig = JSON.stringify([s, MAX, year]);
    if (id === picker.value && seasonPicker.value === year && sig !== lastSig) { lastSig = sig; render(s, year); }
    const m = await getMusicLink(id);
    if (id === picker.value && m !== curMusic) { curMusic = m; setMusic(m); }
  } catch (e) { /* нет сети — оставим старые данные */ }
  finally { busy = false; }
}
setInterval(refresh, REFRESH_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

(async () => {
  try {
    const [players, seasons] = await Promise.all([getPlayers(), getSeasons(), loadMax()]);

    players.forEach(p => { const o = el("option", null, p.name); o.value = p.id; picker.append(o); });
    seasons.forEach(y => { const o = el("option", null, y); o.value = y; seasonPicker.append(o); });

    const qs = new URLSearchParams(location.search);
    const qid = qs.get("id"), qyear = qs.get("year");
    if (qid) picker.value = qid;
    if (qyear && seasons.includes(qyear)) seasonPicker.value = qyear;

    picker.onchange = show;
    seasonPicker.onchange = show;

    if (players.length && seasons.length) show();
  } catch (e) { document.getElementById("root").append(el("p", "err", e.message)); }
})();
</script>
</body>
</html>
